<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Sick of mE — Metronome</title>
<style>
:root{--red:#ff1a1a;--bg:#090909;--panel:#171717;--line:#333;--text:#eee;--muted:#999}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#242424 0,#0d0d0d 45%,#050505 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:20px}
.app{width:min(620px,100%);background:linear-gradient(180deg,#1c1c1c,#101010);border:1px solid #303030;border-radius:18px;padding:28px;box-shadow:0 20px 60px #000}
h1{margin:0;text-align:center;color:var(--red);font-size:clamp(2rem,7vw,3.5rem);letter-spacing:3px;text-transform:uppercase}
.subtitle{text-align:center;color:var(--muted);margin:4px 0 26px}
.display{background:#030303;border:2px solid #2b2b2b;border-radius:14px;padding:24px;text-align:center;box-shadow:inset 0 0 30px #000}
.bpm{font-size:clamp(4rem,15vw,7rem);font-weight:800;line-height:1;color:#fff}
.unit{color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.beats{display:flex;justify-content:center;gap:10px;margin:22px 0}
.beat{width:16px;height:16px;border-radius:50%;background:#444;transition:.08s}
.beat.active{background:var(--red);box-shadow:0 0 18px var(--red);transform:scale(1.35)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:20px}
button,input{font:inherit}
button{border:1px solid #444;background:#222;color:#fff;border-radius:10px;padding:13px 16px;cursor:pointer}
button:hover{border-color:var(--red)}
button:active{transform:translateY(1px)}
.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:800;min-width:130px}
.primary:hover{background:#d00}
.range{width:100%;accent-color:var(--red);margin:24px 0 8px}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.quick button{padding:8px 12px}
.footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px;color:var(--muted);font-size:.85rem}
a{color:#fff}
@media(max-width:500px){.app{padding:20px}.controls{grid-template-columns:1fr 1fr}.primary{grid-column:1/-1;grid-row:1}.footer{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<main class="app">
<h1>Sick of mE</h1>
<div class="subtitle">METRONOME // PRACTICE TOOL</div>
<section class="display" aria-label="Metronome">
<div class="bpm" id="bpmValue">120</div>
<div class="unit">BPM</div>
<div class="beats" id="beats" aria-hidden="true"></div>
</section>
<input class="range" id="tempo" type="range" min="30" max="240" value="120" aria-label="Tempo">
<div class="controls">
<button id="minus">− 5 BPM</button>
<button class="primary" id="start">START</button>
<button id="plus">+ 5 BPM</button>
</div>
<div class="quick" style="margin-top:14px">
<button data-bpm="60">60</button><button data-bpm="80">80</button><button data-bpm="100">100</button><button data-bpm="120">120</button><button data-bpm="140">140</button><button data-bpm="160">160</button><button data-bpm="180">180</button>
</div>
<div class="footer">
<span>Space = start/stop</span>
<a href="../">← Back to Sick of mE</a>
</div>
</main>
<script>
const bpmEl=document.getElementById('bpmValue');
const tempo=document.getElementById('tempo');
const startBtn=document.getElementById('start');
const beatsEl=document.getElementById('beats');
const audioCtx=window.AudioContext||window.webkitAudioContext;
let bpm=120,running=false,timer=null,nextTime=0,beat=0;

for(let i=0;i<4;i++){const d=document.createElement('div');d.className='beat';beatsEl.appendChild(d)}
const dots=[...beatsEl.children];

function setBpm(v){bpm=Math.max(30,Math.min(240,Number(v)));bpmEl.textContent=bpm;tempo.value=bpm}
function clickSound(time,accent=false){
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.frequency.value=accent?1100:800;
 gain.gain.setValueAtTime(accent?.24:.16,time);
 gain.gain.exponentialRampToValueAtTime(.001,time+.045);
 osc.connect(gain).connect(audioCtx.destination);osc.start(time);osc.stop(time+.05);
}
function schedule(){
 while(nextTime<audioCtx.currentTime+.1){
   const index=beat%4;
   clickSound(nextTime,index===0);
   const delay=Math.max(0,(nextTime-audioCtx.currentTime)*1000);
   setTimeout(()=>{dots.forEach(d=>d.classList.remove('active'));dots[index].classList.add('active')},delay);
   nextTime+=60/bpm;beat++;
 }
 timer=setTimeout(schedule,25);
}
async function toggle(){
 if(!running){
   if(!audioCtx)return;
   await audioCtx.resume();running=true;startBtn.textContent='STOP';beat=0;nextTime=audioCtx.currentTime+.05;schedule();
 }else{
   running=false;startBtn.textContent='START';clearTimeout(timer);dots.forEach(d=>d.classList.remove('active'));
 }
}
tempo.addEventListener('input',e=>setBpm(e.target.value));
document.getElementById('minus').onclick=()=>setBpm(bpm-5);
document.getElementById('plus').onclick=()=>setBpm(bpm+5);
document.querySelectorAll('[data-bpm]').forEach(b=>b.onclick=()=>setBpm(b.dataset.bpm));
startBtn.onclick=toggle;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}});
setBpm(120);
</script>
</body>
</html>
